# The generated application and the reporting platform, on one origin.
#
#   http://localhost/app      the application generated from an EML model
#   http://localhost/report   the reporting platform, already loaded with that
#                             application's schema, reports, charts and dashboard
#
# Bring it up with ./start.sh, which generates the application and derives the
# reporting pack first — this file cannot do either, and expects both to exist
# under common/.runtime/. Down again with ./stop.sh.
#
# ── The two profiles ────────────────────────────────────────────────────────
#
#   demo (default)  one PostgreSQL 16 with Apache AGE, holding three databases:
#                   the application's, the platform's enterprise_config, and its
#                   ers_knowledge graph. One container, one image to pull.
#
#   prod            two servers, each the image its application actually asks
#                   for: pgvector on PostgreSQL 18 for the generated
#                   application, Apache AGE on 16 for the reporting platform.
#
# Either way the reporting platform's configuration never shares a database with
# the application it reports on. Regenerating the application drops and
# recreates its tables; the reports have to survive that.
#
# ── Why nothing declares depends_on for a database ──────────────────────────
#
# A `depends_on` naming a service that is not in the active profile makes
# compose refuse to start at all, so a service that must run under both profiles
# cannot name either database. Each waits for its own instead: the generated
# backend migrates on start and is restarted until that succeeds, the reporting
# platform bootstraps its schema on first request, and the seeder waits
# explicitly for both — including for the application's bus_ tables to exist,
# since an empty database means "not migrated yet" rather than "nothing to
# report on".

name: app-and-report

x-app-db-url: &app-db-url
  postgres://${DB_USER:-app}:${DB_PASSWORD:-app}@${APP_DB_HOST:-postgres}:5432/${APP_DB_NAME:-appdb}

services:
  # ── demo: one server, three databases ────────────────────────────────────
  postgres:
    profiles: ["demo"]
    image: apache/age:PG16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${APP_DB_NAME:-appdb}
    volumes:
      - demo_pg:/var/lib/postgresql/data
      - ./common/docker/pg-init:/docker-entrypoint-initdb.d:ro
    # Electric follows the write-ahead log, which it can only do when the log
    # carries row data.
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${APP_DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── prod: each application on the server it asks for ─────────────────────
  postgres-app:
    profiles: ["prod"]
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${APP_DB_NAME:-appdb}
    volumes:
      # PostgreSQL 18 wants the mount at /var/lib/postgresql and keeps its data
      # in a subdirectory; mounting the old path directly makes it refuse to
      # start.
      - prod_pg_app:/var/lib/postgresql
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${APP_DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-report:
    profiles: ["prod"]
    image: apache/age:PG16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${REPORT_DB_USER:-enterprise}
      POSTGRES_PASSWORD: ${REPORT_DB_PASSWORD:-enterprise_pass}
      POSTGRES_DB: enterprise_config
    volumes:
      - prod_pg_report:/var/lib/postgresql/data
      - ./common/docker/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPORT_DB_USER:-enterprise} -d enterprise_config"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── The generated application ─────────────────────────────────────────────
  #
  # Built from common/.runtime/app, which ./start.sh generates from the model
  # and then puts on /app with the subpath overlay. The build context is the
  # whole generated project, not ./backend or ./frontend: the root manifest is a
  # workspace root naming backend, frontend *and* tests, so an install that
  # cannot see all three fails with `Workspace not found "tests"`.
  electric:
    image: electricsql/electric:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: *app-db-url
      ELECTRIC_INSECURE: "true"
    expose:
      - "3000"

  app-backend:
    build:
      context: ./common/.runtime/app
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: *app-db-url
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      # The browser reaches the application through nginx on port 80, so that
      # is the origin the API must accept a sign-in from — not the port the
      # front end happens to listen on inside its container.
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      PORT: "4001"
      ELECTRIC_URL: http://electric:3000
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:8000/v1}
      AI_API_KEY: ${AI_API_KEY:-local}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-bge-small-en-v1.5}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-384}
      ENABLE_MODEL_CONTEXT: ${ENABLE_MODEL_CONTEXT:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/api/me/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  app-frontend:
    build:
      context: ./common/.runtime/app
      dockerfile: ./frontend/Dockerfile
      args:
        # Empty: the client calls /api on whatever origin served the page, and
        # the front end forwards it to the API itself. A base URL compiled into
        # the bundle is an address the image can never be run under any other
        # name.
        VITE_API_URL: ""
        VITE_APP_URL: ${PUBLIC_ORIGIN:-http://localhost}/app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      BACKEND_URL: http://app-backend:4001
    expose:
      - "4000"
    depends_on:
      app-backend:
        condition: service_healthy

  # ── The reporting platform ────────────────────────────────────────────────
  report:
    build:
      context: ./enterprise_reporting_tanstack
      dockerfile: ../common/docker/reporting.Dockerfile
      # The overlay and the seeder live in common/, which is not the build
      # context. Naming it as an extra context keeps the context itself small —
      # the alternative is building from the repository root and carrying both
      # products plus their node_modules into every build.
      additional_contexts:
        common: ./common
      args:
        BASE_PATH: /report
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${REPORT_DB_USER:-app}:${REPORT_DB_PASSWORD:-app}@${REPORT_DB_HOST:-postgres}:5432/enterprise_config
      GRAPH_DATABASE_URL: postgresql://${REPORT_DB_USER:-app}:${REPORT_DB_PASSWORD:-app}@${REPORT_DB_HOST:-postgres}:5432/ers_knowledge
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — ./start.sh writes one into .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required — ./start.sh writes one into .env}
      MASTRA_URL: ${MASTRA_URL:-}
      LLAMA_REASONING_URL: ${LLAMA_REASONING_URL:-}
      LLAMA_EMBEDDING_URL: ${LLAMA_EMBEDDING_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"

  # ── Loading the application into the platform ─────────────────────────────
  #
  # One shot. Registers the application's database as a data source, caches its
  # introspected schema, and writes the reporting pack. Idempotent, so it runs
  # on every `up` rather than only the first.
  seeder:
    build:
      context: ./enterprise_reporting_tanstack
      dockerfile: ../common/docker/seeder.Dockerfile
      additional_contexts:
        common: ./common
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${REPORT_DB_USER:-app}:${REPORT_DB_PASSWORD:-app}@${REPORT_DB_HOST:-postgres}:5432/enterprise_config
      APP_DATABASE_URL: *app-db-url
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required — ./start.sh writes one into .env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — ./start.sh writes one into .env}
      REPORTING_PACK: /pack/reporting-pack.json
    volumes:
      - ./common/.runtime/pack:/pack:ro
    depends_on:
      report:
        condition: service_started

  # ── The front door ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./common/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  demo_pg:
  prod_pg_app:
  prod_pg_report:

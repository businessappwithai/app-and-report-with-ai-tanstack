# The root — its own CI.
#
# `common/` holds everything that is neither of the two products: the modelling
# language both of them read, the published guide and viewers, the example
# models, and the build, seed and docker pieces that run the two together.
# Neither neighbouring workflow covers it — both are `paths:`-filtered to their
# own subfolder — so a pull request touching only these paths ran no checks at
# all until this one existed.
#
# Four things are checked, and each is here because nothing else would catch
# what it catches:
#
#   models   Every model in the repository checks clean, and the two copies of
#            the shared examples — language/examples and html/models — are still
#            byte-identical. One set is what the CLI reads, the other is what
#            the published guide serves.
#   types    `common/{language,build,scripts}/**` under the strict config. Needs
#            app-with-ai-tanstack checked out beside it — see the step. Worth knowing before you
#            read a failure here: without @types/node and @types/bun installed,
#            tsc reports thousands of phantom errors instead — every `node:`
#            builtin and every `process` unresolvable. The root manifest carries
#            both, which is most of why it exists.
#   lint     Biome over `common/language/` and `common/scripts/`, at
#            --diagnostic-level=error.
#            The config is `language/biome.json` rather than one at the
#            repository root: a root config makes both subfolders' own configs
#            "nested roots" and Biome then refuses to run at all. That is also
#            why `bun run lint` is two commands — pointing Biome at `language`
#            and `scripts` in one invocation makes it find that same file twice
#            and fail the same way.
#   stacks   Every `--stack` the CLI offers actually generates, and so does
#            the shipped `appwithai` binary — a different entry point.
#   wasm-cli The shipped `appwithai-wasm` binary, on bun 1.3 rather than 1.4.
#            Its overlay (WebAssembly PostgreSQL in place of `pg`, node in
#            place of bun) is a stage no other check reaches.
#
# That last job is the one worth explaining. Two modules under `language/cli`
# reach down into `app-with-ai-tanstack/packages` on purpose — the shipped JDM
# converter and the generator orchestrator — so that the CLI and the modelling
# tool cannot disagree about what a rule flow compiles to. Nothing type-checks
# those two paths: one imports across a project boundary, the other resolves
# the orchestrator at runtime from a non-literal specifier. Moving either file
# breaks generation and nothing else. It is exactly how generation broke when
# this folder was first promoted to the root, and running the generator is the
# only way to notice.
#
# Those files live in another repository now, checked out beside this one by
# the step below, so `paths:` cannot watch them: a change to
# app-with-ai-tanstack does not trigger a run here. `orchestrate.yml` is what
# notices instead — it builds both repositories at their tips on a weekly
# schedule, so a move that breaks generation surfaces within the week rather
# than on whichever pull request next happens to touch common/.
#
# A path-filtered run that is skipped reports no status at all, so if these jobs
# are ever made required checks they need a skip-path fallback too.

name: Root CI

# The two `paths:` lists below are identical and must stay so. GitHub Actions
# does not support YAML anchors, so there is no way to state them once.
on:
  push:
    branches: [main]
    paths:
      - "common/**"
      - "docker-compose.yml"
      - "start.sh"
      - "stop.sh"
      - ".github/workflows/root-ci.yml"
  pull_request:
    paths:
      - "common/**"
      - "docker-compose.yml"
      - "start.sh"
      - "stop.sh"
      - ".github/workflows/root-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Two pins, because the two command-line interfaces do not share a runtime.
#
#   BUN_VERSION       1.4 — what app-with-ai-tanstack itself pins, and what the
#                     Dockerfiles the `appwithai` CLI generates run on. Every
#                     job here uses it unless it is named below.
#   BUN_VERSION_WASM  1.3 — the `appwithai-wasm` path. The one job that runs
#                     that CLI takes this instead.
#
# Running the WASM CLI on the other pin would go green and prove nothing about
# the runtime it actually ships on, which is why it gets a job rather than a
# step. `check-clis.ts` prints the bun each result came from, so a job wired to
# the wrong pin says so in its own output.
#
# Moving either forward is a deliberate step, taken by running the checks.
env:
  BUN_VERSION: "1.4.0"
  BUN_VERSION_WASM: "1.3.11"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The manifest and every check live in common/ now. The one step that does not
# start there names its own directory.
defaults:
  run:
    working-directory: common

jobs:
  language:
    name: Models, types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # `type-check` needs it, which is not obvious from the job's name.
      # `language/cli/src/generate/jdm.ts` imports the shipped JDM converter and
      # the mermaid flowchart parser out of that repository by relative path, on
      # purpose, so the CLI and the modelling tool cannot disagree about what a
      # rule flow compiles to. With the folder absent, tsc reports the two
      # imports unresolvable and then two implicit-any parameters downstream of
      # them — four errors that look like a broken file and are really a missing
      # directory.
      #
      # It lands on an ignored path, so the "No uncommitted changes" step at the
      # end of this job does not see it.
      - name: Check out app-with-ai-tanstack
        uses: actions/checkout@v4
        with:
          repository: businessappwithai/app-with-ai-tanstack
          ref: main
          path: app-with-ai-tanstack

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # --frozen-lockfile, so a dependency added or dropped in package.json
      # without regenerating bun.lock fails here rather than resolving to
      # something different on every machine.
      - name: Install root tooling
        run: bun install --frozen-lockfile

      # Runs the checker over language/examples and examples, then compares
      # html/models against its counterpart for each shared model. The checker
      # writes a .error file beside every model it reads — that is its
      # interface — and the script removes any it created that git does not
      # already track, so a passing run leaves the tree as it found it.
      - name: Check every model
        run: bun run check:models

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      # A model that checks clean can still leave the tree dirty, and a
      # generated file committed stale looks identical to one committed fresh
      # until someone regenerates it. Fail on either.
      - name: No uncommitted changes
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checks modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi

  stacks:
    name: Generate with every stack and the appwithai CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root tooling
        run: bun install --frozen-lockfile

      # node-rest and enterprise-reporting are self-contained — they write files
      # and need nothing installed. tanstack-nestjs drives the shipped
      # orchestrator, which needs this workspace's dependencies present: with a
      # node_modules at the repository root and none here, resolution stops at
      # the root and the generate fails on `Cannot find package 'zod'`.
      # Neither product is vendored here any more; both are fetched from their
      # own repository. `main` rather than a pin, deliberately: this job is here
      # to notice when the generator moves under us, and a pinned ref would
      # notice nothing. The reproducible build is `orchestrate.yml`, which takes
      # a ref per repository as an input.
      - name: Check out app-with-ai-tanstack
        uses: actions/checkout@v4
        with:
          repository: businessappwithai/app-with-ai-tanstack
          ref: main
          path: app-with-ai-tanstack

      - name: Install app-with-ai-tanstack
        working-directory: app-with-ai-tanstack
        run: bun install --frozen-lockfile

      - name: Generate with every stack
        run: bun run check:stacks

      # The shipped `appwithai` binary, which check:stacks does not touch — that
      # one drives this repository's own CLI, which loads the generator as a
      # library. Different entry point, different argument parsing, different
      # defaults. On BUN_VERSION (1.4), the runtime this CLI ships on.
      - name: Generate with the appwithai CLI
        run: bun run check:cli

  # The WASM CLI, in its own job for one reason: bun 1.3 rather than 1.4. It is
  # not a variant of the job above — `appwithai-wasm` runs the same pipeline and
  # then applies an overlay that replaces `pg` with WebAssembly PostgreSQL and
  # bun with node. The overlay is the part worth checking: it is where a rename
  # in the generator turns into an application that generates cleanly and then
  # cannot start, and running the other CLI proves nothing about it.
  wasm-cli:
    name: Generate with the appwithai-wasm CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION_WASM }}

      - name: Install root tooling
        run: bun install --frozen-lockfile

      - name: Check out app-with-ai-tanstack
        uses: actions/checkout@v4
        with:
          repository: businessappwithai/app-with-ai-tanstack
          ref: main
          path: app-with-ai-tanstack

      - name: Install app-with-ai-tanstack
        working-directory: app-with-ai-tanstack
        run: bun install --frozen-lockfile

      - name: Generate with the appwithai-wasm CLI
        run: bun run check:cli:wasm

  # The only check that runs the derived reporting SQL against the schema the
  # generator actually emits. The pack is built from a parsed model while the
  # tables come from a separate compiler in the other project, and nothing
  # type-checks one against the other — so a column the generator renames leaves
  # the pack building cleanly and every report failing at run time. It caught
  # exactly that on its first run.
  reporting-pack:
    name: Reporting pack against a real schema
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root tooling
        run: bun install --frozen-lockfile

      # The tanstack-nestjs generate this check drives needs that workspace,
      # for the same reason the stacks job does.
      # Neither product is vendored here any more; both are fetched from their
      # own repository. `main` rather than a pin, deliberately: this job is here
      # to notice when the generator moves under us, and a pinned ref would
      # notice nothing. The reproducible build is `orchestrate.yml`, which takes
      # a ref per repository as an input.
      - name: Check out app-with-ai-tanstack
        uses: actions/checkout@v4
        with:
          repository: businessappwithai/app-with-ai-tanstack
          ref: main
          path: app-with-ai-tanstack

      - name: Install app-with-ai-tanstack
        working-directory: app-with-ai-tanstack
        run: bun install --frozen-lockfile

      - name: Install psql
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # --require-server, so a service that never came up fails here instead of
      # skipping quietly. A check that passes without running is worse than no
      # check: it took a stopwatch to tell the two apart the first time this
      # job went green.
      - name: Run every derived query
        run: bun run check:pack:ci

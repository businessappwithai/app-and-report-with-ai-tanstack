# The root — its own CI.
#
# This repository holds the modelling language both products read, the published
# guide and viewers, the example models, and the build, seed and docker pieces
# that run the two together. The products themselves are separate repositories:
#
#   businessappwithai/app-with-ai-tanstack
#   businessappwithai/enterprise_reporting_tanstack
#
# `deps.json` names the commit of each that this repository is known to work
# with, and it is the only place those refs appear. The `resolve` job reads it
# and every other job checks out against its outputs, so moving a pin is one
# edit. `./deps.sh` reads the same file to place the same commits locally — a
# developer's tree and a runner check out identically.
#
# ── Why the checkouts are needed at all ─────────────────────────────────────
#
# Two modules under `common/language/cli` reach into app-with-ai-tanstack on
# purpose — the shipped JDM converter and the generator orchestrator — so that
# the CLI and the modelling tool cannot disagree about what a rule flow compiles
# to. `jdm.ts` imports the converter unconditionally and sits on every
# generation path, so *every* --stack target needs that checkout, not only the
# heavy one, and `tsc` needs it to resolve the import at all. That is why the
# `language` job checks it out even though it only type-checks and lints.
#
# `tanstack-nestjs` additionally drives the orchestrator, which needs that
# repository's own dependencies installed: with a node_modules under common/ and
# none there, resolution stops here and the generate fails on
# `Cannot find package 'zod'`.
#
# ── The four checks ─────────────────────────────────────────────────────────
#
#   models   Every model checks clean, and the two copies of the shared examples
#            — language/examples and html/models — are still byte-identical. One
#            set is what the CLI reads, the other is what the published guide
#            serves.
#   types    `common/{language,build,scripts}/**` under the strict config.
#            Without @types/node and @types/bun installed, tsc reports thousands
#            of phantom errors instead — every `node:` builtin and every
#            `process` unresolvable. The manifest carries both, which is most of
#            why it exists.
#   lint     Biome over `common/language/` and `common/scripts/`, at
#            --diagnostic-level=error. The config is `language/biome.json`
#            rather than one at the repository root, and `bun run lint` is two
#            commands — see the note in common/package.json for why.
#   stacks   Every `--stack` the CLI offers actually generates.
#
# A path-filtered run that is skipped reports no status at all, so if these jobs
# are ever made required checks they need a skip-path fallback too.

name: Root CI

# The two `paths:` lists below are identical and must stay so. GitHub Actions
# does not support YAML anchors, so there is no way to state them once.
#
# `deps.json` is in both: moving a pin changes what this workflow builds
# against, which is exactly when it should run.
on:
  push:
    branches: [main]
    paths:
      - "common/**"
      - "deps.json"
      - "deps.sh"
      - "docker-compose.yml"
      - "start.sh"
      - "stop.sh"
      - ".github/workflows/root-ci.yml"
  pull_request:
    paths:
      - "common/**"
      - "deps.json"
      - "deps.sh"
      - "docker-compose.yml"
      - "start.sh"
      - "stop.sh"
      - ".github/workflows/root-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pinned to the version these steps were verified against, including the
# `--frozen-lockfile` install of the app-with-ai-tanstack workspace that the
# tanstack-nestjs target needs. Moving it forward is a deliberate step, taken by
# running the checks.
env:
  BUN_VERSION: "1.3.11"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # deps.json is the single source of truth for what this repository builds
  # against. Reading it once here and passing the result down means a pin is
  # never restated in a `with:` block, where it would drift silently.
  resolve:
    name: Resolve pinned dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_repository: ${{ steps.read.outputs.app_repository }}
      app_ref: ${{ steps.read.outputs.app_ref }}
      report_repository: ${{ steps.read.outputs.report_repository }}
      report_ref: ${{ steps.read.outputs.report_ref }}

    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read deps.json
        run: |
          set -euo pipefail
          read_dep() {
            jq -er --arg name "$1" --arg key "$2" \
              '.dependencies[] | select(.name == $name) | .[$key]' deps.json
          }
          {
            echo "app_repository=$(read_dep app-with-ai-tanstack repository)"
            echo "app_ref=$(read_dep app-with-ai-tanstack ref)"
            echo "report_repository=$(read_dep enterprise_reporting_tanstack repository)"
            echo "report_ref=$(read_dep enterprise_reporting_tanstack ref)"
          } | tee -a "$GITHUB_OUTPUT"

  language:
    name: Models, types and lint
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 10
    defaults:
      run:
        working-directory: common

    steps:
      - uses: actions/checkout@v4

      # Source only — nothing is installed in it. `tsc` needs these files on
      # disk to resolve the two cross-repository imports in jdm.ts; without the
      # checkout the type-check fails with TS2307 rather than anything useful.
      - name: Check out app-with-ai-tanstack
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.app_repository }}
          ref: ${{ needs.resolve.outputs.app_ref }}
          path: app-with-ai-tanstack

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # --frozen-lockfile, so a dependency added or dropped in package.json
      # without regenerating bun.lock fails here rather than resolving to
      # something different on every machine.
      - name: Install root tooling
        run: bun install --frozen-lockfile

      # Runs the checker over language/examples and examples, then compares
      # html/models against its counterpart for each shared model. The checker
      # writes a .error file beside every model it reads — that is its interface
      # — and the script removes any it created that git does not already track,
      # so a passing run leaves the tree as it found it.
      - name: Check every model
        run: bun run check:models

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      # A model that checks clean can still leave the tree dirty, and a
      # generated file committed stale looks identical to one committed fresh
      # until someone regenerates it. Fail on either.
      #
      # The dependency checkout is gitignored, so it cannot show up here.
      - name: No uncommitted changes
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checks modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi

  stacks:
    name: Generate with every stack
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 20
    defaults:
      run:
        working-directory: common

    steps:
      - uses: actions/checkout@v4

      - name: Check out app-with-ai-tanstack
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.app_repository }}
          ref: ${{ needs.resolve.outputs.app_ref }}
          path: app-with-ai-tanstack

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root tooling
        run: bun install --frozen-lockfile

      # node-rest and enterprise-reporting are self-contained once the checkout
      # is present — they write files and need nothing installed there.
      # tanstack-nestjs drives the shipped orchestrator, which needs that
      # workspace's dependencies.
      - name: Install app-with-ai-tanstack
        working-directory: app-with-ai-tanstack
        run: bun install --frozen-lockfile

      - name: Generate with every stack
        run: bun run check:stacks

  # The only check that runs the derived reporting SQL against the schema the
  # generator actually emits. The pack is built from a parsed model while the
  # tables come from a separate compiler in another repository, and nothing
  # type-checks one against the other — so a column the generator renames leaves
  # the pack building cleanly and every report failing at run time. It caught
  # exactly that on its first run.
  reporting-pack:
    name: Reporting pack against a real schema
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 25
    defaults:
      run:
        working-directory: common

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Check out app-with-ai-tanstack
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.app_repository }}
          ref: ${{ needs.resolve.outputs.app_ref }}
          path: app-with-ai-tanstack

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root tooling
        run: bun install --frozen-lockfile

      # The tanstack-nestjs generate this check drives needs that workspace,
      # for the same reason the stacks job does.
      - name: Install app-with-ai-tanstack
        working-directory: app-with-ai-tanstack
        run: bun install --frozen-lockfile

      - name: Install psql
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # --require-server, so a service that never came up fails here instead of
      # skipping quietly. A check that passes without running is worse than no
      # check: it took a stopwatch to tell the two apart the first time this
      # job went green.
      - name: Run every derived query
        run: bun run check:pack:ci

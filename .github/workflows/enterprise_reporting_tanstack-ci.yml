# enterprise_reporting_tanstack — CI, run from the subfolder that holds it.
#
# Unlike its neighbour, this project arrived with no workflow of its own, so
# this is not a port. The steps are the commands the project's own CLAUDE.md
# names as its quality gate — `bun run precommit` is lint + typecheck +
# format:check — plus the production build, which is the one check that reads
# every module and so catches an import the type-checker alone lets through.
#
# `paths:` keeps a change to app-with-ai-tanstack from running any of this. A
# path-filtered run that is skipped reports no status at all, so if these jobs
# are ever made required checks they need a skip-path fallback too.

name: enterprise_reporting_tanstack CI

on:
  push:
    branches: [main]
    paths:
      - "enterprise_reporting_tanstack/**"
      - ".github/workflows/enterprise_reporting_tanstack-ci.yml"
  pull_request:
    paths:
      - "enterprise_reporting_tanstack/**"
      - ".github/workflows/enterprise_reporting_tanstack-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# The project's package.json asks only for `bun >= 1.3.0`, which would let a
# runner pick up a release nobody has run this against. Pinned to the version
# these steps were verified against; moving it forward is a deliberate step.
env:
  BUN_VERSION: "1.3.11"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: enterprise_reporting_tanstack

jobs:
  checks:
    name: Lint, type-check, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # --frozen-lockfile, so a dependency added or dropped in package.json
      # without regenerating bun.lock fails here rather than resolving to
      # something different on every machine.
      - name: Install
        run: bun install --frozen-lockfile

      # Both of the next two steps are red today, on code that predates this
      # workflow — 34 lint errors and 695 type errors. They gate anyway, on
      # purpose: a check that is not enforced is how this project came to have
      # a `format:check` that could not run and a `build` that did not build.
      # The count is the backlog, and it only goes down while something is
      # watching it.
      - name: Lint
        run: bun run lint

      # The 695 are almost all in src/ (597); the rest are e2e/, language/ and
      # scripts/, which tsconfig.json includes as well. A single unescaped
      # backtick used to mask every one of them, so this number was 1 until the
      # commit before this workflow landed.
      - name: Type-check
        run: bun run typecheck

      - name: Formatting
        run: bun run format:check

      # The build is the only step that resolves every import in the graph. A
      # name imported from a module that does not export it type-checks under
      # `skipLibCheck`-shaped configs and fails here, which is where the bundler
      # actually has to find it.
      - name: Build
        run: bun run build

  # The E2E suite is deliberately not here yet. It needs a dev server on 4050,
  # PostgreSQL with Apache AGE for the knowledge graph, and a seeded admin
  # account before `playwright test` will do anything — see the project's
  # docker-compose.yml for the shape of that. Adding it is worth doing; it is
  # its own piece of work, not a step appended to the job above.

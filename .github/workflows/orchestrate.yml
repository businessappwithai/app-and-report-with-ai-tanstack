# The orchestrator: build both applications from their own repositories, wire
# them together, run them, and prove the result works.
#
# This repository holds no application source. It holds the language both
# applications read, the glue that runs them together, and this workflow. The
# two applications are checked out here at a ref you choose, which is what makes
# a build reproducible: an orchestration is the *set* of commits it composed,
# not "whatever main was that day".
#
#     ┌──────────────── this repository ────────────────┐
#     │  language · reporting pack · overlay · compose  │
#     └───────────────────────┬─────────────────────────┘
#                             │
#         ┌───────────────────┴───────────────────┐
#         ▼                                       ▼
#   app-with-ai-tanstack              enterprise_reporting_tanstack
#         │  the generator                        │  the reporting platform
#         └───────────────────┬───────────────────┘
#                             ▼
#                    generate the application
#                             ▼
#                 derive its reporting pack
#                             ▼
#              build images · start · seed · test
#
# What this proves that no other workflow here does: that the two applications,
# *as their repositories currently stand*, still compose. Every check in
# `Root CI` runs against this repository's own code and would stay green through
# a change on the other side of either boundary that breaks the composition.

name: Orchestrate

on:
  workflow_dispatch:
    inputs:
      model:
        description: "EML model to build the application from"
        default: common/language/examples/crm.eml.mmd
        type: string
      app_ref:
        description: "app-with-ai-tanstack ref (branch, tag or SHA)"
        default: main
        type: string
      report_ref:
        description: "enterprise_reporting_tanstack ref (branch, tag or SHA)"
        default: main
        type: string
      profile:
        description: "Compose profile"
        default: demo
        type: choice
        options: [demo, prod]
  # Weekly, on main, against both repositories' heads. This is the run that
  # catches a change over there before somebody hits it here.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# 1.4, matching app-with-ai-tanstack's own pin and the Dockerfiles its
# generator writes. This workflow generates through the full-stack path, so
# it is that CLI's runtime that matters here; the WASM CLI runs on 1.3 and
# has its own job in root-ci.yml.
env:
  BUN_VERSION: "1.4.0"
  MODEL: ${{ inputs.model || 'common/language/examples/crm.eml.mmd' }}
  APP_REF: ${{ inputs.app_ref || 'main' }}
  REPORT_REF: ${{ inputs.report_ref || 'main' }}
  PROFILE: ${{ inputs.profile || 'demo' }}

concurrency:
  group: orchestrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Build both applications and run them together
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the orchestrator
        uses: actions/checkout@v4

      # Into the paths the glue addresses. `start.sh` would clone these itself;
      # here `actions/checkout` does it, so a private repository needs only a
      # token on these two steps and the workflow is otherwise identical.
      - name: Check out app-with-ai-tanstack
        uses: actions/checkout@v4
        with:
          repository: businessappwithai/app-with-ai-tanstack
          ref: ${{ env.APP_REF }}
          path: app-with-ai-tanstack

      - name: Check out enterprise_reporting_tanstack
        uses: actions/checkout@v4
        with:
          repository: businessappwithai/enterprise_reporting_tanstack
          ref: ${{ env.REPORT_REF }}
          path: enterprise_reporting_tanstack

      - name: Record exactly what is being composed
        run: |
          {
            echo "### Composed from"
            echo ""
            echo "| Component | Ref | Commit |"
            echo "|---|---|---|"
            echo "| orchestrator | \`${GITHUB_REF_NAME}\` | \`$(git rev-parse --short HEAD)\` |"
            echo "| app-with-ai-tanstack | \`${APP_REF}\` | \`$(git -C app-with-ai-tanstack rev-parse --short HEAD)\` |"
            echo "| enterprise_reporting_tanstack | \`${REPORT_REF}\` | \`$(git -C enterprise_reporting_tanstack rev-parse --short HEAD)\` |"
            echo ""
            echo "Model: \`${MODEL}\` · profile: \`${PROFILE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install the orchestrator's tooling
        working-directory: common
        run: bun install --frozen-lockfile

      # The generator runs in-process from the language CLI, so its workspace's
      # imports have to resolve on this runner.
      - name: Install app-with-ai-tanstack
        working-directory: app-with-ai-tanstack
        run: bun install --frozen-lockfile

      - name: Check the model
        working-directory: common
        run: |
          bun language/checker.ts "../${MODEL}"
          # The checker writes a .error file beside whatever it reads.
          rm -f "../${MODEL}.error"

      - name: Generate the application
        working-directory: common
        run: |
          bun language/cli/eml.ts generate \
            -i "../${MODEL}" -o ../common/.runtime/app \
            -n "$(basename "${MODEL}" | sed 's/\.eml\.mmd$//')" \
            --stack tanstack-nestjs --force

      - name: Put it on /app
        working-directory: common
        run: bun build/subpath-overlay.ts --dir ../common/.runtime/app/frontend --base /app

      - name: Derive the reporting pack from the same model
        working-directory: common
        run: |
          mkdir -p ../common/.runtime/pack
          bun build/reporting-pack.ts \
            -i "../${MODEL}" -o ../common/.runtime/pack/reporting-pack.json \
            --database "$(basename "${MODEL}" | sed 's/\.eml\.mmd$//' | tr '[:upper:]-' '[:lower:]_' | tr -cd 'a-z0-9_')"

      - name: Write the configuration
        run: |
          mkdir -p common/.runtime
          gen() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          NAME="$(basename "${MODEL}" | sed 's/\.eml\.mmd$//')"
          DB="$(printf '%s' "$NAME" | tr '[:upper:]-' '[:lower:]_' | tr -cd 'a-z0-9_')"
          {
            echo "AUTH_SECRET=$(gen)"
            echo "ENCRYPTION_KEY=$(gen)"
            echo "JWT_SECRET=$(gen)"
            echo "SESSION_SECRET=$(gen)"
            echo "BETTER_AUTH_SECRET=$(gen)"
            echo "APP_NAME=${NAME}"
            echo "APP_DB_NAME=${DB}"
            echo "PUBLIC_PORT=80"
            echo "PUBLIC_ORIGIN=http://localhost"
            if [ "${PROFILE}" = "prod" ]; then
              echo "APP_DB_HOST=postgres-app"
              echo "REPORT_DB_HOST=postgres-report"
              echo "REPORT_DB_USER=enterprise"
              echo "REPORT_DB_PASSWORD=enterprise_pass"
            else
              echo "APP_DB_HOST=postgres"
              echo "REPORT_DB_HOST=postgres"
              echo "REPORT_DB_USER=app"
              echo "REPORT_DB_PASSWORD=app"
            fi
          } > common/.runtime/.env

      - name: Build the images and start everything
        run: |
          docker compose --env-file common/.runtime/.env --profile "${PROFILE}" up -d --build
          docker compose --env-file common/.runtime/.env --profile "${PROFILE}" ps

      # The seeder is a one-shot service and exits; everything else has to stay
      # up. Waiting on the front door rather than on a fixed sleep.
      - name: Wait for the front door
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --max-time 5 http://localhost/healthz >/dev/null 2>&1; then
              echo "nginx answering after ${i} attempt(s)"; exit 0
            fi
            sleep 5
          done
          echo "::error::nginx never answered on port 80"
          docker compose --env-file common/.runtime/.env --profile "${PROFILE}" ps
          exit 1

      - name: Prove both applications answer, with the right content types
        run: bash common/build/smoke.sh

      - name: Logs, on failure
        if: failure()
        run: |
          docker compose --env-file common/.runtime/.env --profile "${PROFILE}" ps || true
          for s in postgres app-backend app-frontend report seeder nginx; do
            echo "::group::${s}"
            docker compose --env-file common/.runtime/.env --profile "${PROFILE}" logs --tail 120 "$s" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Stop
        if: always()
        run: docker compose --env-file common/.runtime/.env --profile demo --profile prod down --volumes --remove-orphans || true

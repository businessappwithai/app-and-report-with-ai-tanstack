# One origin, two applications.
#
#   http://localhost/app      the generated application
#   http://localhost/report   the reporting platform
#
# Neither prefix is stripped. Both applications are *built* to live under their
# prefix — bundler base, router basepath, static lookup — so an incoming
# /report/dashboard is the path the reporting app's router expects to match.
# Stripping here would give it /dashboard while every link it writes says
# /report/dashboard, and navigation would break on the first click.
#
# See common/build/subpath-overlay.ts for how that is applied.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, with a short TTL, and every upstream addressed
    # through a variable.
    #
    # nginx resolves a literal proxy_pass host once, at startup, and refuses to
    # start when it does not resolve. That makes the proxy depend on both
    # applications already being up — so a restart of either, or a compose
    # profile that starts them in a different order, takes the whole origin
    # down. Through a variable the name is resolved per request instead: an
    # application that is not up yet answers 502 and starts working the moment
    # it is, which is what a front door should do.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 64m;

    # Redirects stay relative.
    #
    # The three `return` directives below are written as paths, and nginx turns
    # a relative redirect into an absolute one using `$host` and *the port it is
    # listening on* — 80, inside the container. Published anywhere else, which
    # is exactly what `./start.sh --port 8080` does, `/report` answered
    # `Location: http://localhost/report/`: the port dropped, and the browser
    # went to an origin with nothing on it. The three entry points a reader is
    # given — `/`, `/app` and `/report` — were the three that broke.
    #
    # Off, nginx sends the path it was given and the browser resolves it against
    # the origin it actually used, port and all.
    absolute_redirect off;

    # Nothing is served at the root: this origin is two applications, and
    # guessing which one somebody meant is worse than saying so.
    location = / {
        return 302 /app/;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --- The generated application's root-absolute assets -------------------
    #
    # This application cannot be built under a URL prefix. Its TanStack Start
    # version writes the client bundle to `public/_build/` and everything else
    # to `public/assets/`, serves `public/` at the server root, and honours
    # Vite's `base` for only some of the URLs it emits — a half-prefixed build
    # where a stylesheet request is answered with the SPA's HTML, which a
    # browser reports as no error at all while the page renders unstyled.
    #
    # So it keeps its root-absolute asset URLs and this proxy routes those
    # namespaces to it. That is safe precisely because the *reporting* app can
    # be built under a prefix, and is: everything it asks for lives under
    # /report/, so the two never contend for a path. Anything added at the root
    # here belongs to the generated application.
    location ^~ /_build/ {
        set $assets_upstream http://app-frontend:4000;
        proxy_pass $assets_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /assets/ {
        set $assets2_upstream http://app-frontend:4000;
        proxy_pass $assets2_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /fonts/ {
        set $fonts_upstream http://app-frontend:4000;
        proxy_pass $fonts_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The application's API, which its client calls root-absolute. Vite's `base`
    # rewrites asset URLs and the router's basepath rewrites links; neither
    # touches a `fetch("/api/…")` written as a string literal in source. The
    # front end serves /api itself and forwards it to the backend, which is what
    # keeps the session cookie same-origin.
    location ^~ /api/ {
        set $api_upstream http://app-frontend:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    location = /favicon.ico {
        set $favicon_upstream http://app-frontend:4000;
        proxy_pass $favicon_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- The generated application -----------------------------------------
    location /app/ {
        set $app_upstream http://app-frontend:4000;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
    location = /app {
        return 301 /app/;
    }

    # --- The reporting platform ---------------------------------------------
    location /report/ {
        set $report_upstream http://report:3000;
        proxy_pass $report_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /report;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
    location = /report {
        return 301 /report/;
    }
}

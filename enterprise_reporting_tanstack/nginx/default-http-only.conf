# Enterprise Reporting System - Nginx Configuration (HTTP only)
# Use this config for initial setup BEFORE obtaining SSL certificates.
# After running certbot, switch to default.conf for HTTPS.

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Upstream application
upstream ers_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint (used by Docker healthcheck)
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Request size limits
    client_max_body_size 50M;
    client_body_buffer_size 10M;

    # Static assets with proper MIME types - serve directly from filesystem
    location /assets/ {
        alias /app/dist/assets/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        types {
            text/css css;
            application/javascript js;
            application/json json;
            image/svg+xml svg svgz;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            font/woff2 woff2;
            font/woff woff;
        }
    }

    # Monaco Editor VS Code files
    location /vs/ {
        alias /app/dist/client/vs/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        types {
            application/javascript js;
            text/css css;
        }
    }

    # Proxy to Next.js application
    location / {
        proxy_pass http://ers_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://ers_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Public share routes with rate limiting (prevents abuse of public resources)
    location /share/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://ers_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets caching (TanStack Start)
    location /_build/ {
        proxy_pass http://ers_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Legacy Next.js path support
    location /_next/static/ {
        proxy_pass http://ers_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}

# Enterprise Reporting System - Docker Compose
# PostgreSQL (apache/age) serves both the config DB and the knowledge graph.
# Two databases in the same instance: enterprise_config + ers_knowledge

services:
  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:1.25-alpine
    container_name: ers-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/certbot/conf:/etc/letsencrypt:ro
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ers-network

  # Certbot for automatic SSL certificate renewal
  certbot:
    image: certbot/certbot:latest
    container_name: ers-certbot
    volumes:
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/certbot/conf:/etc/letsencrypt
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - ers-network

  # PostgreSQL + Apache AGE — config DB + knowledge graph
  # apache/age:PG16 = PostgreSQL 16 with AGE graph extension pre-installed
  # enterprise_config: application config (users, reports, charts, dashboards, etc.)
  # ers_knowledge:     AGE property graph for NL query context
  postgres:
    image: apache/age:PG16
    container_name: ers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enterprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterprise_pass}
      POSTGRES_DB: enterprise_config
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/pg-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enterprise} -d enterprise_config"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ers-network

  # Redis (for BullMQ job queue)
  redis:
    image: redis:7-alpine
    container_name: ers-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -z "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes;
      else
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      fi'
    volumes:
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ers-network

  # Main Application
  app:
    image: enterprise-reporting-system:latest
    container_name: ers-app
    restart: unless-stopped
    environment:
      # Application
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      PORT: 3000

      # Authentication
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}

      # PostgreSQL — config DB (enterprise_config) and knowledge graph (ers_knowledge)
      DATABASE_URL: postgresql://${POSTGRES_USER:-enterprise}:${POSTGRES_PASSWORD:-enterprise_pass}@postgres:5432/enterprise_config
      GRAPH_DATABASE_URL: postgresql://${POSTGRES_USER:-enterprise}:${POSTGRES_PASSWORD:-enterprise_pass}@postgres:5432/ers_knowledge

      # Redis (Job Queue)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Job Processing
      JOB_OUTPUT_PATH: /app/job-outputs
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}

      # Error Reporting
      NEXT_PUBLIC_ERROR_REPORTING_EMAIL: ${NEXT_PUBLIC_ERROR_REPORTING_EMAIL:-admin@yourcompany.com}

      # Server-Side Pagination
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-50}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-1000}
      DATA_TABLE_PAGE_SIZE: ${DATA_TABLE_PAGE_SIZE:-100}
      EXPORT_PAGE_SIZE: ${EXPORT_PAGE_SIZE:-1000}
      VIRTUAL_SCROLL_THRESHOLD: ${VIRTUAL_SCROLL_THRESHOLD:-500}
      ENABLE_VIRTUAL_SCROLLING: ${ENABLE_VIRTUAL_SCROLLING:-true}

      # Natural Language Query (NL Query) - AI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      LLAMA_REASONING_URL: ${LLAMA_REASONING_URL:-http://localhost:8080}
      LLAMA_REASONING_MODEL: ${LLAMA_REASONING_MODEL:-qwen3.6}
    volumes:
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/app/job-outputs:/app/job-outputs
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/app/uploads:/app/uploads
      - ${DATA_PATH:-/srv/enterprise-reporting-system}/app/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ers-network

networks:
  ers-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
